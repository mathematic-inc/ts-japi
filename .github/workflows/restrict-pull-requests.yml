name: Restrict pull requests

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close-outside-pull-request:
    if: >-
      github.event.pull_request.author_association != 'OWNER' &&
      github.event.pull_request.author_association != 'MEMBER' &&
      github.event.pull_request.author_association != 'COLLABORATOR' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'renovate[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Close pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          DISCUSSION_URL: https://github.com/${{ github.repository }}/discussions/new
        run: >-
          gh pr close "$PR_URL" --comment
          "We do not accept unsolicited pull requests. Please start a GitHub Discussion at
          $DISCUSSION_URL and wait for review. If accepted, a Mathematic maintainer or agent will
          open the implementation pull request."
